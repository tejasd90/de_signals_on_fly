<!doctype html><html><head><meta charset="utf-8"><title>PA + 1:100 dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
 body{background:#0d1117;color:#c9d1d9;font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;margin:0}
 header{display:flex;gap:14px;align-items:center;padding:8px 14px;background:#161b22;border-bottom:1px solid #30363d;flex-wrap:wrap}
 select,button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:5px;padding:4px 8px;font-size:13px}
 #wrap{display:flex;height:calc(100vh - 44px)}
 #chart{flex:1;min-width:0}
 #side{width:330px;border-left:1px solid #30363d;overflow-y:auto;padding:10px 12px;background:#0d1117}
 h4{margin:12px 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8b949e}
 .px{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:4px;margin-bottom:3px;border-left:3px solid #30363d}
 .APPROACHING{opacity:.55;font-weight:400;border-left-color:#d29922}
 .TESTING{opacity:.85;font-weight:600;border-left-color:#58a6ff}
 .CONFIRMED{opacity:1;font-weight:700;border-left-color:#3fb950}
 .lv{color:#8b949e;font-variant-numeric:tabular-nums}
 .legend{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 8px}
 .sw{padding:2px 6px;border-radius:3px;color:#07090c;font-weight:700;font-size:11px}
 .note{color:#8b949e;font-size:11px;line-height:1.4;margin-top:4px}
 .req{font-variant-numeric:tabular-nums}
 .big{font-size:17px;font-weight:700;color:#e6edf3}
 #stamp{color:#8b949e;font-size:12px;margin-left:auto}
</style></head><body>
<header>
  <b>Price action → 1:100</b>
  <select id="asset"><option>BTC</option><option>ETH</option></select>
  <select id="res"><option value="15">15m</option><option value="60" selected>1h</option>
    <option value="240">4h</option><option value="1440">1d</option></select>
  <select id="lim"><option>300</option><option selected>800</option><option>2000</option><option>6000</option></select>
  <label><input type="checkbox" id="auto" checked> auto-refresh</label>
  <span id="stamp">—</span>
</header>
<div id="wrap"><div id="chart"></div><div id="side">
  <h4>Live · price approaching</h4><div id="prox"></div>
  <h4>Live · move needed for 1:100</h4><div id="live"></div>
  <h4>Colour scale (required move)</h4><div class="legend" id="leg"></div>
  <div class="note" id="note"></div>
</div></div>
<script>
const BINS=[[0.5,'#2ea043','<0.5%'],[1.5,'#7ee787','0.5–1.5%'],[3,'#d29922','1.5–3%'],
            [6,'#db6d28','3–6%'],[1e9,'#da3633','>6%']];
const NA='#21262d';
const col=v=>{if(v==null||!isFinite(v))return NA;const a=Math.abs(v);for(const[t,c]of BINS)if(a<t)return c;return NA;};
document.getElementById('leg').innerHTML=BINS.map(b=>`<span class="sw" style="background:${b[1]}">${b[2]}</span>`).join('')
  +`<span class="sw" style="background:${NA};color:#8b949e">n/a</span>`;
document.getElementById('note').textContent=
 'Required move = smallest spot move, across all strikes, that turns the option into a 1:100. '
 +'“now” reprices with time value left (implied vol from the chain); “exp” is intrinsic only, so it is always the harder number. '
 +'Dots are DESCRIPTIVE: the audit found breaks arrive after the move 62–74% of the time — which is why the panel on the right flags APPROACHING before CONFIRMED.';

const SLOTS=['immediate','next','weekly'];
let P=null;

function draw(d){
  P=d;
  const C=d.candles, n=C.ts.length, x=C.ts.map(t=>new Date(t*1000));
  const tr=[{type:'candlestick',x,open:C.o,high:C.h,low:C.l,close:C.c,name:'price',
    increasing:{line:{color:'#3fb950'}},decreasing:{line:{color:'#f85149'}},xaxis:'x',yaxis:'y'}];

  // pane 2 — price action dots
  const ev=d.events||[];
  if(ev.length) tr.push({type:'scatter',mode:'markers',xaxis:'x',yaxis:'y2',name:'PA',
    x:ev.map(e=>new Date(e.ts*1000)),y:ev.map(e=>e.imp),
    marker:{size:ev.map(e=>6+2.2*e.imp),opacity:.85,
      color:ev.map(e=>e.kind==='wedge'?'#d2a8ff':e.kind==='break'?'#58a6ff':'#8b949e'),
      line:{width:1,color:'#0d1117'}},
    text:ev.map(e=>{let s=e.desc||'';
      if(e.c_now!=null)s+=`<br>1:100 then — CALL ${(+e.c_now).toFixed(2)}% now / ${(+e.c_exp).toFixed(2)}% exp`;
      if(e.p_now!=null)s+=`<br>1:100 then — PUT ${(+e.p_now).toFixed(2)}% now / ${(+e.p_exp).toFixed(2)}% exp`;
      return s;}),
    hovertemplate:'%{text}<extra></extra>'});

  // pane 3 — 3 expiry rows; per candle 4 cells: CALLnow CALLexp PUTnow PUTexp (+gap)
  const byTs={}; (d.req||[]).forEach(r=>{(byTs[r.ts]=byTs[r.ts]||{})[r.slot]=r;});
  const COLS=5, z=[[],[],[]], tx=[[],[],[]], hv=[[],[],[]], xs=[];
  for(let i=0;i<n;i++) for(let k=0;k<COLS;k++) xs.push(i*COLS+k);
  SLOTS.forEach((slot,row)=>{
    for(let i=0;i<n;i++){
      const r=(byTs[C.ts[i]]||{})[slot];
      const cells=r?[r.c_now,r.c_exp,r.p_now,r.p_exp]:[null,null,null,null];
      const names=['CALL now','CALL exp','PUT now','PUT exp'];
      const strikes=r?[r.c_k_now,r.c_k_exp,r.p_k_now,r.p_k_exp]:[null,null,null,null];
      for(let k=0;k<4;k++){
        const v=cells[k];
        z[row].push(v==null||!isFinite(v)?null:Math.abs(v));
        tx[row].push(v==null||!isFinite(v)?'':Math.abs(v).toFixed(1));
        hv[row].push(r?`${slot} · exp ${r.expiry} · T+${(+r.tte_d).toFixed(2)}d<br>`
          +`${names[k]}: ${v==null?'n/a':(+v).toFixed(2)+'%'}`
          +(strikes[k]?`<br>strike ${(+strikes[k]).toLocaleString()}`:'')
          +`<br>spot ${(+r.spot).toLocaleString()}`:'no chain');
      }
      z[row].push(null); tx[row].push(''); hv[row].push('');   // gap column
    }
  });
  const cs=[];const edges=[0,0.5,1.5,3,6,12];
  BINS.forEach((b,i)=>{const a=edges[i]/12,bb=Math.min(edges[i+1],12)/12;cs.push([a,b[1]]);cs.push([bb,b[1]]);});
  tr.push({type:'heatmap',xaxis:'x2',yaxis:'y3',x:xs,y:SLOTS,z,text:tx,hovertext:hv,
    texttemplate:'%{text}',textfont:{size:9,color:'#07090c'},
    colorscale:cs,zmin:0,zmax:12,showscale:false,xgap:0.5,ygap:2,
    hovertemplate:'%{hovertext}<extra></extra>'});

  const last=byTs[C.ts[n-1]]||{};
  const ylab=SLOTS.map(s=>last[s]?`${s}<br>${last[s].expiry}`:s);
  Plotly.react('chart',tr,{
    paper_bgcolor:'#0d1117',plot_bgcolor:'#0d1117',font:{color:'#c9d1d9',size:11},
    margin:{l:78,r:10,t:8,b:26},showlegend:false,hovermode:'closest',dragmode:'pan',
    xaxis:{domain:[0,1],anchor:'y3',rangeslider:{visible:false},gridcolor:'#21262d',
           matches:null,showticklabels:true,domainu:null},
    xaxis2:{domain:[0,1],anchor:'y3',visible:false,range:[-0.5,n*COLS-0.5]},
    yaxis:{domain:[0.46,1],gridcolor:'#21262d',side:'right'},
    yaxis2:{domain:[0.30,0.44],gridcolor:'#21262d',side:'right',title:{text:'PA',font:{size:10}}},
    yaxis3:{domain:[0,0.28],tickmode:'array',tickvals:SLOTS,ticktext:ylab,
            tickfont:{size:9},autorange:'reversed'}
  },{responsive:true,scrollZoom:true,displayModeBar:false});
  document.getElementById('stamp').textContent='updated '+new Date().toLocaleTimeString();
}

function renderProx(rows){
  const o=['APPROACHING','TESTING','CONFIRMED'];
  document.getElementById('prox').innerHTML = !rows||!rows.length ? '<span class="note">nothing near</span>' :
    rows.slice(0,12).sort((a,b)=>o.indexOf(a.state)-o.indexOf(b.state)||Math.abs(a.dist_atr)-Math.abs(b.dist_atr))
    .map(r=>`<div class="px ${r.state}"><span>${r.above?'▲':'▼'} ${r.label}</span>
      <span class="lv">${r.level.toLocaleString(undefined,{maximumFractionDigits:0})}
      · ${r.dist_pct>=0?'+':''}${r.dist_pct.toFixed(2)}%</span></div>`).join('');
}
function renderLive(rows){
  document.getElementById('live').innerHTML = !rows||!rows.length ? '<span class="note">—</span>' :
    rows.map(r=>`<div style="margin-bottom:9px">
      <div><b>${r.slot}</b> <span class="lv">${r.expiry} · T+${(+r.tte_d).toFixed(2)}d</span></div>
      <div class="req">CALL <span class="big" style="color:${col(r.c_now)}">${r.c_now==null?'–':(+r.c_now).toFixed(2)}%</span>
        <span class="lv">now / ${r.c_exp==null?'–':(+r.c_exp).toFixed(2)}% exp · K ${r.c_k_now?(+r.c_k_now).toLocaleString():'–'}</span></div>
      <div class="req">PUT <span class="big" style="color:${col(r.p_now)}">${r.p_now==null?'–':(+r.p_now).toFixed(2)}%</span>
        <span class="lv">now / ${r.p_exp==null?'–':(+r.p_exp).toFixed(2)}% exp · K ${r.p_k_now?(+r.p_k_now).toLocaleString():'–'}</span></div></div>`).join('');
}

async function load(){
  const a=asset.value,r=res.value,l=lim.value;
  try{
    const d=await (await fetch(`/api/payload?asset=${a}&res=${r}&limit=${l}`)).json();
    if(!d.error){draw(d);renderProx(d.proximity);}
  }catch(e){}
  try{
    const lv=await (await fetch(`/api/live?asset=${a}`)).json();
    if(lv.rows)renderLive(lv.rows);
  }catch(e){}
}
['asset','res','lim'].forEach(id=>document.getElementById(id).onchange=load);
load(); setInterval(()=>{if(document.getElementById('auto').checked)load();},15*60*1000);
</script></body></html>
