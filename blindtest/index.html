<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Chart Test</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--ink:#e6e8ee;--mute:#8a90a0;--line:#2a2f3a;--acc:#f0b429}
*{box-sizing:border-box}html,body{height:100%}body{display:flex;flex-direction:column;overflow:hidden;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header,footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:var(--panel)}
header{border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line)}
.tag{padding:3px 8px;border-radius:6px;background:#222734;color:var(--mute)}.tag b{color:var(--ink)}.practice{background:#3a2f12;color:var(--acc)}
#chart{flex:1;min-height:0}
button{background:#232838;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{border-color:#4a5163}button.on{background:#33405a;border-color:#5a6a8a}button:disabled{opacity:.4;cursor:default}
.go{background:#1d4d3a;border-color:#2c7a5a}.no{background:#4a2224;border-color:#7a3a3d}.sp{flex:1}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(480px,92vw)}
textarea{width:100%;height:80px;background:#0f1115;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
#msg{padding:40px;text-align:center;font-size:18px;display:none}.kbd{color:var(--mute);font-size:12px}
</style></head><body>
<header><span id="ctr" class="tag"></span><span id="meta"></span><span id="cnt" class="kbd"></span><span class="sp"></span>
<span class="kbd">→ +1 · Shift+→ +3 · ↑ +10 · − finer · = coarser · M more strikes · C conviction · L leave · N next</span></header>
<div id="notebar" style="display:flex;gap:8px;padding:6px 16px;background:#13161c;border-bottom:1px solid var(--line);align-items:center">
 <input id="nt" placeholder="Note anything you see at this moment, Enter to save" style="flex:1;background:#0f1115;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit">
 <button id="addnote">Save note</button><span id="nlist" class="kbd" style="max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span></div>
<div id="chart"></div><div id="msg"></div>
<footer>
 <span>TF</span><span id="tfs"></span><span style="width:10px"></span>
 <span>Step</span><button data-n="1">+1</button><button data-n="3">+3</button><button data-n="10">+10</button>
 <span>View</span><button data-v="40">40</button><button data-v="100" class="on">100</button><button data-v="250">250</button><button data-v="0">all</button><button id="more" title="add a strike further OTM (M)">+ strike</button>
 <span class="sp"></span>
 <button id="leave" class="no">Leave (no trade)</button><button id="call" class="go">CONVICTION</button><button id="next" style="display:none">Next chart →</button>
</footer>
<div id="modal"><div class="box"><h3 style="margin-top:0">Multibagger conviction</h3>
 <p class="kbd">Which strike(s)?</p><div id="ks"></div>
 <p class="kbd">Target you expect from here:</p><div id="tg"></div>
 <p class="kbd">What do you see? (optional, helps define it)</p><textarea id="note"></textarea>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button id="cancel">Cancel</button><button id="confirm" class="go" disabled>Confirm</button></div></div></div>
<script>
const TGT=["5x","10x","25x","50x","100x+"];let S=null,VIEW=100,tgt=null,ks=new Set(),busy=false;
const $=id=>document.getElementById(id);
$("tg").innerHTML=TGT.map(t=>`<button data-t="${t}">${t}</button>`).join(" ");
async function api(body){if(busy)return;busy=true;try{const r=await fetch(body?"/api/act":"/api/state",body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});const j=await r.json();if(j.error)alert(j.error);else{S=j;draw()}}finally{busy=false}}
function cs(rows,xa,ya){return{type:"candlestick",x:rows.map(r=>r[0]),open:rows.map(r=>r[1]),high:rows.map(r=>r[2]),low:rows.map(r=>r[3]),close:rows.map(r=>r[4]),
 xaxis:xa,yaxis:ya,hoverinfo:"skip",increasing:{line:{color:"#26a69a",width:1},fillcolor:"#26a69a"},decreasing:{line:{color:"#ef5350",width:1},fillcolor:"#ef5350"},showlegend:false}}
function fmt(h){const d=Math.floor(h/24),hh=Math.floor(h%24),m=Math.round((h*60)%60);return(d?d+"d ":"")+hh+"h "+String(m).padStart(2,"0")+"m"}
function draw(){
 if(S.done){$("chart").style.display="none";$("msg").style.display="block";$("msg").textContent="All charts done. Thank you. Results will be scored separately.";document.querySelector("footer").style.display="none";$("ctr").textContent="";$("meta").innerHTML="";return}
 const np=S.n_practice,k=S.i+1;$("ctr").innerHTML=S.practice?`<span class="tag practice">PRACTICE ${k} / ${np} (not scored)</span>`:`<b>Chart ${k-np}</b> / ${S.n-np}`;
 $("meta").innerHTML=(S.type?`<span class="tag"><b>${S.type}</b></span> `:"")+(S.time?(S.time.bucket?`<span class="tag">expiry: <b>${S.time.bucket}</b></span>`:`<span class="tag">expiry in <b>${fmt(S.time.tte_h)}</b></span> <span class="tag"><b>${S.time.clock}</b></span>`):"");
 $("nlist").textContent=S.notes&&S.notes.length?`${S.notes.length} note(s): `+S.notes[S.notes.length-1]:"";
 if(S.level){$("tfs").innerHTML=`<button data-z="finer" ${S.level<=1?"disabled":""}>− finer</button> <span class="kbd">${"●".repeat(S.level)}${"○".repeat(S.levels-S.level)}</span> <button data-z="coarser" ${S.level>=S.levels?"disabled":""}>coarser +</button>`}
 else $("tfs").innerHTML=["15m","30m","1h","2h","4h","6h","12h","1d"].map(t=>`<button data-tf="${t}" class="${t===S.tf?"on":""}" ${S.tfs.includes(t)?"":"disabled title='15m: expiry day only'"}>${t}</button>`).join(" ");
 const end=S.ended||S.expired;document.querySelectorAll("[data-n],[data-tf],#call,#leave,#more").forEach(b=>b.disabled=end||(b.dataset.tf&&!S.tfs.includes(b.dataset.tf)));
 document.querySelectorAll("[data-z]").forEach(b=>{if(end)b.disabled=true});
 if(S.extra>=S.extra_max)$("more").disabled=true;
 $("next").style.display=end?"":"none";$("cnt").textContent=`steps ${S.steps} · candles ${S.candles} · extra strikes ${S.extra}`+(S.expired&&!S.ended?" · reached expiry":"")+(S.ended?" · recorded":"");
 const n=S.panels.length,cols=3,rows=Math.ceil(n/cols),top=0.30,gap=0.035,ph=(1-top-gap*rows)/rows,cw=(1-0.02*(cols-1))/cols;
 const last=S.spot.length?S.spot[S.spot.length-1][0]:0;const allx=S.panels.map(p=>p.bars.length?p.bars[0][0]:last);
 const first=Math.min(S.spot.length?S.spot[0][0]:last,...allx);const lo=VIEW?Math.max(first,last-VIEW):first,rng=[lo-0.5,last+Math.max(2,(last-lo)*0.04)];
 const vis=r=>r.filter(x=>x[0]>=lo);
 const L={paper_bgcolor:"#0f1115",plot_bgcolor:"#0f1115",margin:{l:6,r:6,t:6,b:6},dragmode:"pan",showlegend:false,annotations:[],
  xaxis:{domain:[0,1],range:rng,showticklabels:false,rangeslider:{visible:false},gridcolor:"#1c2029",anchor:"y"},yaxis:{domain:[1-top+0.02,1],showticklabels:false,gridcolor:"#1c2029"}};
 L.annotations.push({text:"underlying",x:0,xref:"paper",y:1,yref:"paper",showarrow:false,font:{color:"#6b7286"},xanchor:"left",yanchor:"top"});
 const T=[cs(vis(S.spot),"x","y")];
 S.panels.forEach((p,j)=>{const a=j+2,r=Math.floor(j/cols),c=j%cols,y1=1-top-gap*(r+1)-ph*r,y0=y1-ph,x0=c*(cw+0.02);
  L["xaxis"+a]={domain:[x0,x0+cw],matches:"x",showticklabels:false,rangeslider:{visible:false},gridcolor:"#1c2029",anchor:"y"+a};
  L["yaxis"+a]={domain:[y0,y1],showticklabels:false,gridcolor:"#1c2029",anchor:"x"+a};
  L.annotations.push({text:`<b>${p.label}</b>`+(p.otm!=null?` · OTM ${p.otm}%`:"")+(p.pct!=null?` · ${p.pct}% of und.`:""),x:x0,xref:"paper",y:y1+0.003,yref:"paper",showarrow:false,font:{color:"#9aa1b3",size:12},xanchor:"left",yanchor:"bottom"});
  T.push(cs(vis(p.bars),"x"+a,"y"+a))});
 Plotly.react("chart",T,L,{displayModeBar:false,scrollZoom:true,responsive:true});
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.dataset.n)api({action:"step",n:+b.dataset.n});else if(b.dataset.z)api({action:"zoom",dir:b.dataset.z});
 else if(b.id==="addnote")saveNote();else if(b.dataset.tf)api({action:"tf",tf:b.dataset.tf});
 else if(b.dataset.v!==undefined){VIEW=+b.dataset.v;document.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===b));draw()}
 else if(b.dataset.t){tgt=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));chk()}
 else if(b.dataset.k!==undefined){const k=+b.dataset.k;ks.has(k)?ks.delete(k):ks.add(k);b.classList.toggle("on");chk()}
 else if(b.id==="more")api({action:"more"});
 else if(b.id==="call"){tgt=null;ks=new Set();$("ks").innerHTML=S.panels.map((p,j)=>`<button data-k="${j}">${j+1}</button>`).join(" ");document.querySelectorAll("[data-t]").forEach(x=>x.classList.remove("on"));$("note").value="";chk();$("modal").style.display="flex"}
 else if(b.id==="cancel")$("modal").style.display="none";
 else if(b.id==="confirm"){$("modal").style.display="none";api({action:"call",target:tgt,strikes:[...ks],note:$("note").value})}
 else if(b.id==="leave"){if(confirm("Leave this chart (no trade)?"))api({action:"leave"})}
 else if(b.id==="next")api({action:"next"})});
function saveNote(){const t=$("nt").value.trim();if(!t)return;$("nt").value="";api({action:"note",text:t})}
$("nt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();saveNote()}e.stopPropagation()});
function chk(){$("confirm").disabled=!(tgt&&ks.size)}
document.addEventListener("keydown",e=>{if($("modal").style.display==="flex"||!S||S.done)return;const end=S.ended||S.expired;
 if(S.level&&!end&&(e.key==="-"||e.key==="="||e.key==="+")){api({action:"zoom",dir:e.key==="-"?"finer":"coarser"});return}
 if(e.key==="ArrowRight"&&!end){e.preventDefault();api({action:"step",n:e.shiftKey?3:1})}else if(e.key==="ArrowUp"&&!end){e.preventDefault();api({action:"step",n:10})}
 else if((e.key==="m"||e.key==="M")&&!end&&S.extra<S.extra_max)api({action:"more"});
 else if((e.key==="c"||e.key==="C")&&!end)$("call").click();else if((e.key==="l"||e.key==="L")&&!end)$("leave").click();
 else if((e.key==="n"||e.key==="N")&&end)api({action:"next"})});
api();
</script></body></html>
